<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <title>SmartRail | Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; color: #0F172A; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 12px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: #64748B; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
      button { background: #00529B; color: #fff; border: 0; border-radius: 2px; padding: 12px 24px; font-size: 15px; font-weight: 600; min-height: 44px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192x192.png" alt="SmartRail" />
      <h1>You're offline</h1>
      <p>SmartRail needs an internet connection to load this page. Connect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
